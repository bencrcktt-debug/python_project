<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Shares</title>
    <style>
        :root {
            --embed-footer-height: 56px;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .embed-shell {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + var(--embed-footer-height));
            border: none;
        }
    </style>
</head>
<body>
    <div class="embed-shell">
        <iframe src="https://loobylookup.streamlit.app?embed=true" title="Snake Shares app"></iframe>
    </div>
</body>
</html>
